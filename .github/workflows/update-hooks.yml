name: Update hooks

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          install-only: true
      - name: Update hook versions
        run: prek update
      - name: Run hooks
        run: prek run --all-files || prek run --all-files || true
      - name: Check which files changed
        id: changes
        run: |
          if [ "$(git status --porcelain)" = " M .pre-commit-config.yaml" ]; then
            echo "config-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "config-only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: Update pre-commit hooks
          title: Update pre-commit hooks
          body: Automated hook update from the `update-hooks` workflow, using `prek update`.
          branch: update-pre-commit-hooks
          delete-branch: true
      - name: Approve CI run
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          for i in $(seq 1 24); do
            run_ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=update-pre-commit-hooks&event=pull_request" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id')
            [ -n "$run_ids" ] && break
            sleep 5
          done
          if [ -z "$run_ids" ]; then
            echo "No CI run waiting for approval"
            exit 0
          fi
          for run_id in $run_ids; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve" ||
              GH_TOKEN="$PAT" gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
          done
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh pr merge --squash --auto "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" ||
            echo "::warning::Could not enable auto-merge"
      - name: Approve if only the hook config changed
        if: steps.changes.outputs.config-only == 'true' && (steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr review --approve "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
