[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
authors = [
    { "name" = "Tom Carrick", "email" = "tom@carrick.eu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["django>=5.2"]
description = "Login throttling with device cookies"
license = "MIT"
license-files = ["LICENSE"]
name = "django-device-cookies"
readme = "README.rst"
requires-python = ">=3.10"
version = "0.3.0"

[project.urls]
Homepage = "https://github.com/knyghty/django-device-cookies"
Repository = "https://github.com/knyghty/django-device-cookies"

[dependency-groups]
dev = ["coverage[toml]", "prek", "pytest", "pytest-django", "ty"]

[tool.coverage.run]
branch = true
source = ["django_device_cookies"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

[tool.hatch.build.targets.wheel]
packages = ["django_device_cookies"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "DJ",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "F",
    "FLY",
    "FURB",
    "G",
    "I",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TC",
    "TRY",
    "UP",
    "W",
]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"django_device_cookies/apps.py" = ["PLC0415"]
"tests/*" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
force-single-line = true
